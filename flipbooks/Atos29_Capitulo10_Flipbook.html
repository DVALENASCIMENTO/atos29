<script>
/* =========================================================
   ATOS 29 — CAPÍTULO 10
   O PESO DA GLÓRIA DE DEUS

   Os números sobrescritos identificam os parágrafos.
   As referências bíblicas permanecem separadas.
========================================================= */

const conteudo = [

{tipo:"titulo", texto:"O PESO DA GLÓRIA DE DEUS"},
{tipo:"credito", texto:"Ministério Atalaia • Diego Nascimento — Pastor Evangelista"},

{tipo:"sub", texto:"MOMENTOS QUE NÃO PODEM SER EXPLICADOS"},
{tipo:"p", n:1, texto:"Existem momentos na caminhada cristã que não são facilmente explicados por palavras."},
{tipo:"p", n:2, texto:"São momentos em que não se trata simplesmente de ouvir uma canção, participar de uma reunião ou assistir a uma apresentação."},
{tipo:"p", n:3, texto:"Há momentos em que a presença de Deus se torna tão intensa para nós que parece haver um peso espiritual que não conseguimos descrever completamente."},
{tipo:"p", n:4, texto:"Foi assim que vivi duas experiências que ficaram marcadas na minha memória."},
{tipo:"p", n:5, texto:"Uma aconteceu durante uma apresentação do Ministério de Louvor Trazendo a Arca.", destaque:true},
{tipo:"p", n:6, texto:"A outra aconteceu durante uma apresentação da Pastora Ludmila Ferber.", destaque:true},
{tipo:"p", n:7, texto:"Em ambas as ocasiões, experimentei aquilo que, na minha compreensão, posso descrever como o peso da glória de Deus.", destaque:true},

{tipo:"sub", texto:"NÃO ERA APENAS MÚSICA"},
{tipo:"p", n:8, texto:"Eu sempre tive uma relação muito profunda com a música."},
{tipo:"p", n:9, texto:"Desde o início da minha caminhada com Cristo, compreendi que a música poderia ser muito mais do que uma expressão artística."},
{tipo:"p", n:10, texto:"O louvor poderia ser uma forma de adoração."},
{tipo:"p", n:11, texto:"Poderia anunciar a Palavra."},
{tipo:"p", n:12, texto:"Poderia conduzir pessoas à presença de Deus."},
{tipo:"p", n:13, texto:"Poderia preparar o coração para ouvir aquilo que o Senhor desejava falar."},
{tipo:"p", n:14, texto:"Foi justamente por isso que essas duas experiências me marcaram."},
{tipo:"p", n:15, texto:"Eu não estava simplesmente diante de músicos."},
{tipo:"p", n:16, texto:"Eu estava participando de momentos de adoração que produziram em mim uma percepção muito profunda da presença de Deus."},
{tipo:"p", n:17, texto:"A música estava acontecendo, mas aquilo que eu estava experimentando interiormente ia muito além da música."},

{tipo:"sub", texto:"O PESO DA GLÓRIA"},
{tipo:"p", n:18, texto:"Quando usamos a expressão “peso da glória”, estamos tentando descrever uma realidade que aparece nas Escrituras de maneira muito profunda."},
{tipo:"p", n:19, texto:"A Bíblia fala da glória de Deus como algo tão grandioso que, em determinadas ocasiões, aqueles que estavam presentes não conseguiam permanecer de pé ou continuar ministrando normalmente."},
{tipo:"p", n:20, texto:"Na dedicação do templo de Salomão, por exemplo, aconteceu algo extraordinário:"},
{tipo:"ref", texto:"2 Crônicas 5:13-14"},
{tipo:"citacao", texto:"A Casa se encheu de uma nuvem, e a glória do Senhor encheu a Casa de Deus. Os sacerdotes não podiam permanecer ali para ministrar por causa daquela manifestação."},
{tipo:"p", n:21, texto:"A glória de Deus havia enchido o templo."},
{tipo:"p", n:22, texto:"Esse texto sempre me impressionou."},
{tipo:"p", n:23, texto:"Não era apenas uma reunião."},
{tipo:"p", n:24, texto:"Não era apenas música."},
{tipo:"p", n:25, texto:"Não era apenas uma cerimônia."},
{tipo:"p", n:26, texto:"Era uma manifestação da presença e da glória de Deus."},

{tipo:"sub", texto:"UMA EXPERIÊNCIA COM O TRAZENDO A ARCA"},
{tipo:"p", n:27, texto:"Em uma apresentação do Ministério de Louvor Trazendo a Arca, vivi uma dessas experiências."},
{tipo:"p", n:28, texto:"Durante aquele momento de louvor, senti sobre mim aquilo que compreendi como um peso da glória de Deus."},
{tipo:"p", n:29, texto:"Era uma sensação profunda."},
{tipo:"p", n:30, texto:"Algo que marcou meu espírito."},
{tipo:"p", n:31, texto:"Não quero acrescentar detalhes que não vivi, nem tentar explicar tecnicamente aquilo que aconteceu comigo."},
{tipo:"p", n:32, texto:"Quero apenas testemunhar aquilo que posso afirmar:"},
{tipo:"p", n:33, texto:"Eu senti o peso da glória de Deus.", destaque:true},
{tipo:"p", n:34, texto:"A experiência ficou registrada dentro de mim."},
{tipo:"p", n:35, texto:"E, para alguém que havia aprendido a amar a adoração e que posteriormente também serviria ao Senhor através da música, aquele momento teve um significado muito especial."},
{tipo:"p", n:36, texto:"Eu compreendi novamente que o louvor não deve ser tratado como espetáculo."},
{tipo:"p", n:37, texto:"Existe algo muito maior."},

{tipo:"sub", texto:"UMA SEGUNDA EXPERIÊNCIA"},
{tipo:"p", n:38, texto:"Em outra ocasião, durante uma apresentação da Pastora Ludmila Ferber, aconteceu algo semelhante."},
{tipo:"p", n:39, texto:"Novamente experimentei aquilo que reconheci como o peso da glória de Deus."},
{tipo:"p", n:40, texto:"Duas ocasiões diferentes."},
{tipo:"p", n:41, texto:"Dois momentos diferentes."},
{tipo:"p", n:42, texto:"Mas uma mesma percepção espiritual."},
{tipo:"p", n:43, texto:"Isso ficou marcado na minha memória porque me fez compreender ainda mais profundamente que a adoração pode nos conduzir a momentos de profunda reverência diante do Senhor."},
{tipo:"p", n:44, texto:"Não era sobre quem estava cantando."},
{tipo:"p", n:45, texto:"Não era sobre quem estava no palco."},
{tipo:"p", n:46, texto:"Não era sobre uma apresentação humana."},
{tipo:"p", n:47, texto:"Para mim, naquele momento, tudo apontava para Deus."},

{tipo:"sub", texto:"A GLÓRIA NÃO É DO MINISTRO"},
{tipo:"p", n:48, texto:"Essa é uma das lições mais importantes que essas experiências me ensinaram."},
{tipo:"p", n:49, texto:"A glória não pertence ao ministro."},
{tipo:"p", n:50, texto:"Não pertence ao cantor."},
{tipo:"p", n:51, texto:"Não pertence à banda."},
{tipo:"p", n:52, texto:"Não pertence ao pregador."},
{tipo:"p", n:53, texto:"Não pertence ao instrumento."},
{tipo:"p", n:54, texto:"A glória pertence a Deus.", destaque:true},
{tipo:"ref", texto:"Isaías 42:8"},
{tipo:"citacao", texto:"Eu sou o Senhor; este é o meu nome; a minha glória, pois, a outrem não darei."},
{tipo:"p", n:55, texto:"Essa verdade precisa permanecer no centro de qualquer ministério de louvor."},
{tipo:"p", n:56, texto:"Podemos ter grandes músicos."},
{tipo:"p", n:57, texto:"Podemos ter excelentes cantores."},
{tipo:"p", n:58, texto:"Podemos ter equipamentos extraordinários."},
{tipo:"p", n:59, texto:"Podemos organizar grandes eventos."},
{tipo:"p", n:60, texto:"Mas nada disso substitui a presença de Deus."},
{tipo:"p", n:61, texto:"A excelência pode preparar o ambiente."},
{tipo:"p", n:62, texto:"A música pode ser executada com perfeição."},
{tipo:"p", n:63, texto:"Mas somente Deus recebe a glória."},

{tipo:"sub", texto:"O LOUVOR QUE APONTA PARA O CÉU"},
{tipo:"p", n:64, texto:"Quando olho para minha própria história, percebo como Deus foi formando minha compreensão sobre o louvor."},
{tipo:"p", n:65, texto:"Primeiro, aprendi a amar Jesus."},
{tipo:"p", n:66, texto:"Depois, aprendi a buscar Sua presença."},
{tipo:"p", n:67, texto:"Aprendi a estudar a Palavra."},
{tipo:"p", n:68, texto:"Aprendi a orar."},
{tipo:"p", n:69, texto:"Aprendi sobre consagração."},
{tipo:"p", n:70, texto:"E também aprendi que a música poderia ser uma ferramenta para glorificar o Senhor."},
{tipo:"p", n:71, texto:"Por isso, essas experiências tiveram um impacto tão grande sobre mim."},
{tipo:"p", n:72, texto:"Elas me lembraram de que o verdadeiro propósito da música cristã não é produzir admiração pelo músico."},
{tipo:"p", n:73, texto:"É conduzir o coração das pessoas para Deus."},
{tipo:"ref", texto:"Salmos 95:6"},
{tipo:"citacao", texto:"Vinde, adoremos e prostremo-nos; ajoelhemos diante do Senhor que nos criou."},

{tipo:"sub", texto:"QUANDO A PRESENÇA NOS FAZ PARAR"},
{tipo:"p", n:74, texto:"Há momentos em que não precisamos de muitas palavras."},
{tipo:"p", n:75, texto:"A presença de Deus produz reverência."},
{tipo:"p", n:76, texto:"Produz silêncio interior."},
{tipo:"p", n:77, texto:"Produz quebrantamento."},
{tipo:"p", n:78, texto:"Produz consciência da grandeza daquele que estamos adorando."},
{tipo:"p", n:79, texto:"Isaías teve uma experiência dessa natureza."},
{tipo:"ref", texto:"Isaías 6:1-5"},
{tipo:"p", n:80, texto:"Ao contemplar a glória do Senhor, ele não saiu daquela experiência exaltando a si mesmo."},
{tipo:"p", n:81, texto:"Ele reconheceu sua própria condição diante da santidade de Deus."},
{tipo:"p", n:82, texto:"Esse é um princípio que considero fundamental."},
{tipo:"p", n:83, texto:"Quanto mais percebemos a grandeza de Deus, menos espaço existe para a glória humana.", destaque:true},
{tipo:"p", n:84, texto:"A verdadeira presença de Deus não alimenta o orgulho."},
{tipo:"p", n:85, texto:"Ela produz reverência."},

{tipo:"sub", texto:"A GLÓRIA E O MINISTÉRIO"},
{tipo:"p", n:86, texto:"Como músico, essas experiências também me ensinaram uma responsabilidade."},
{tipo:"p", n:87, texto:"Subir em um altar não é simplesmente cantar."},
{tipo:"p", n:88, texto:"Ministrar louvor não é simplesmente executar uma música."},
{tipo:"p", n:89, texto:"Conduzir uma igreja em adoração não é simplesmente escolher um repertório."},
{tipo:"p", n:90, texto:"Existe uma responsabilidade espiritual."},
{tipo:"p", n:91, texto:"O ministro precisa compreender que está servindo."},
{tipo:"p", n:92, texto:"Jesus ensinou:"},
{tipo:"ref", texto:"João 12:26"},
{tipo:"citacao", texto:"Se alguém me serve, siga-me."},
{tipo:"p", n:93, texto:"Servir é diferente de aparecer."},
{tipo:"p", n:94, texto:"Adorar é diferente de performar."},
{tipo:"p", n:95, texto:"Ministrar é diferente de buscar reconhecimento."},
{tipo:"p", n:96, texto:"Essa compreensão foi se tornando cada vez mais forte na minha caminhada."},

{tipo:"sub", texto:"A GLÓRIA QUE TRANSFORMA"},
{tipo:"p", n:97, texto:"A glória de Deus não deve ser apenas uma experiência que nos emociona."},
{tipo:"p", n:98, texto:"Ela precisa produzir transformação."},
{tipo:"p", n:99, texto:"Quando Moisés esteve diante da presença de Deus, seu rosto resplandeceu."},
{tipo:"ref", texto:"Êxodo 34:29"},
{tipo:"p", n:100, texto:"Paulo também ensina que, ao contemplarmos a glória do Senhor, somos transformados."},
{tipo:"ref", texto:"2 Coríntios 3:18"},
{tipo:"p", n:101, texto:"Essa é uma verdade poderosa."},
{tipo:"p", n:102, texto:"Não buscamos a presença de Deus simplesmente para sentir alguma coisa."},
{tipo:"p", n:103, texto:"Buscamos a Deus para sermos transformados por Ele."},
{tipo:"p", n:104, texto:"Se uma experiência espiritual não nos conduz a uma vida mais próxima de Cristo, mais santa, mais obediente, mais humilde e mais comprometida com o Evangelho, precisamos compreender que a experiência por si mesma não é o objetivo."},

/* =========================================================
   PAGINAÇÃO AUTOMÁTICA
========================================================= */

const livro = document.getElementById("livro");
const esquerda = document.getElementById("paginaEsquerda");
const direita = document.getElementById("paginaDireita");

const colunasIds = [
    "colunaE1",
    "colunaE2",
    "colunaD1",
    "colunaD2"
];

let paginas = [];
let paginaAtual = 0;
let temporizadorRedimensionamento;

function criarElemento(item) {
    const el = document.createElement("div");
    el.className = "bloco";

    if (item.tipo === "titulo") {
        el.classList.add("titulo-capitulo");
        el.textContent = item.texto;
    }

    if (item.tipo === "credito") {
        el.classList.add("credito");
        el.textContent = item.texto;
    }

    if (item.tipo === "sub") {
        el.classList.add("subtitulo");
        el.textContent = item.texto;
    }

    if (item.tipo === "p") {
        el.classList.add("paragrafo");

        const numero = document.createElement("sup");
        numero.className = "numero";
        numero.textContent = item.n;

        const texto = document.createElement("span");
        texto.textContent = item.texto;

        if (item.destaque) {
            texto.classList.add("destaque");
        }

        el.append(numero, texto);
    }

    if (item.tipo === "ref") {
        el.classList.add("referencia");
        el.textContent = "📖 " + item.texto;
    }

    if (item.tipo === "citacao") {
        el.classList.add("citacao");
        el.textContent = "“" + item.texto + "”";
    }

    if (item.tipo === "fecho") {
        el.classList.add("fecho");
        el.textContent = item.texto;
    }

    return el;
}

function criarEstruturaTemporaria() {
    const temporario = document.createElement("div");
    temporario.style.position = "absolute";
    temporario.style.left = "-10000px";
    temporario.style.top = "0";
    temporario.style.visibility = "hidden";
    temporario.style.width = getComputedStyle(esquerda).width;
    temporario.style.height = getComputedStyle(esquerda).height;
    temporario.style.padding = getComputedStyle(esquerda).padding;
    temporario.style.boxSizing = "border-box";

    const cabecalho = document.createElement("div");
    cabecalho.className = "cabecalho-pagina";
    cabecalho.innerHTML = "<span>ATOS 29 • A HISTÓRIA CONTINUA</span><span>CAPÍTULO 10</span>";

    const area = document.createElement("div");
    area.className = "colunas";

    const mobile = window.matchMedia("(max-width: 850px)").matches;
    area.style.height = "calc(100% - 75px)";
    area.style.display = "grid";
    area.style.gridTemplateColumns = mobile ? "1fr" : "1fr 1fr";
    area.style.gap = mobile ? "0" : "22px";

    const colunas = [];

    for (let i = 0; i < (mobile ? 1 : 2); i++) {
        const coluna = document.createElement("div");
        coluna.className = "coluna";
        coluna.style.height = "100%";
        coluna.style.overflow = "hidden";
        colunas.push(coluna);
        area.appendChild(coluna);
    }

    temporario.append(cabecalho, area);
    document.body.appendChild(temporario);

    return {temporario, colunas};
}

function medirAlturaDisponivel(estrutura) {
    return estrutura.colunas[0].clientHeight;
}

function paginar() {
    const estrutura = criarEstruturaTemporaria();
    const colunas = estrutura.colunas;
    const limite = medirAlturaDisponivel(estrutura);

    const mobile = window.matchMedia("(max-width: 850px)").matches;
    const quantidadeColunas = mobile ? 1 : 2;

    paginas = [];

    let pagina = [];
    let colunaAtual = 0;
    let colunaElemento = colunas[colunaAtual];

    function salvarPagina() {
        paginas.push(pagina);
    }

    function novaPagina() {
        if (pagina.length) salvarPagina();
        pagina = [];
        colunaAtual = 0;

        colunas.forEach(c => c.innerHTML = "");
        colunaElemento = colunas[0];
    }

    conteudo.forEach(item => {
        const elemento = criarElemento(item);

        colunaElemento.appendChild(elemento);

        if (colunaElemento.scrollHeight > limite + 1) {
            colunaElemento.removeChild(elemento);

            if (colunaAtual < quantidadeColunas - 1) {
                colunaAtual++;
                colunaElemento = colunas[colunaAtual];
            } else {
                novaPagina();
            }

            colunaElemento.appendChild(elemento);

            /* Proteção para um bloco excepcionalmente alto. */
            if (colunaElemento.scrollHeight > limite + 1) {
                elemento.style.fontSize = "10px";
            }
        }

        pagina.push(item);
    });

    if (pagina.length) salvarPagina();

    estrutura.temporario.remove();

    if (!paginas.length) paginas = [[]];

    paginaAtual = Math.min(paginaAtual, paginas.length - 1);
    renderizar();
}

function renderizarPagina(indice, ids) {
    const itens = paginas[indice] || [];

    const mobile = window.matchMedia("(max-width: 850px)").matches;
    const coluna1 = document.getElementById(ids[0]);
    const coluna2 = document.getElementById(ids[1]);

    coluna1.innerHTML = "";
    coluna2.innerHTML = "";

    if (mobile) {
        itens.forEach(item => coluna1.appendChild(criarElemento(item)));
    } else {
        /*
          Os itens da página são distribuídos novamente em duas colunas
          com base no ponto de quebra registrado na paginação.
        */
        const estrutura = criarEstruturaTemporaria();
        const colunasTemp = estrutura.colunas;
        const limite = medirAlturaDisponivel(estrutura);
        let coluna = 0;

        itens.forEach(item => {
            const el = criarElemento(item);
            colunasTemp[coluna].appendChild(el);

            if (colunasTemp[coluna].scrollHeight > limite + 1 && coluna === 0) {
                colunasTemp[coluna].removeChild(el);
                coluna = 1;
                colunasTemp[coluna].appendChild(el);
            }
        });

        colunasTemp.forEach((temp, i) => {
            const destino = i === 0 ? coluna1 : coluna2;
            Array.from(temp.children).forEach(child => {
                destino.appendChild(criarElemento({
                    tipo: child.classList.contains("subtitulo") ? "sub" :
                          child.classList.contains("referencia") ? "ref" :
                          child.classList.contains("citacao") ? "citacao" :
                          child.classList.contains("credito") ? "credito" :
                          child.classList.contains("titulo-capitulo") ? "titulo" :
                          child.classList.contains("fecho") ? "fecho" : "p",
                    n: child.querySelector("sup") ? child.querySelector("sup").textContent : undefined,
                    texto: child.classList.contains("paragrafo")
                        ? child.querySelector("span").textContent
                        : child.textContent.replace(/^📖\s*/, "").replace(/[“”]/g, ""),
                    destaque: !!child.querySelector(".destaque")
                }));
            });
        });

        estrutura.temporario.remove();
    }
}

function renderizar() {
    const total = paginas.length;
    const mobile = window.matchMedia("(max-width: 850px)").matches;

    if (mobile) {
        esquerda.style.display = "block";
        direita.style.display = "none";
        document.querySelector(".lombada").style.display = "none";

        renderizarPagina(paginaAtual, ["colunaE1", "colunaE2"]);
        document.getElementById("numeroE").textContent = paginaAtual + 1;

        document.getElementById("indicador").textContent =
            "Página " + (paginaAtual + 1) + " de " + total;
    } else {
        esquerda.style.display = "block";
        direita.style.display = "block";
        document.querySelector(".lombada").style.display = "block";

        renderizarPagina(paginaAtual, ["colunaE1", "colunaE2"]);

        if (paginaAtual + 1 < total) {
            renderizarPagina(paginaAtual + 1, ["colunaD1", "colunaD2"]);
        } else {
            ["colunaD1", "colunaD2"].forEach(id => {
                document.getElementById(id).innerHTML = "";
            });
        }

        document.getElementById("numeroE").textContent = paginaAtual + 1;
        document.getElementById("numeroD").textContent =
            Math.min(paginaAtual + 2, total);

        document.getElementById("indicador").textContent =
            "Páginas " + (paginaAtual + 1) + "–" +
            Math.min(paginaAtual + 2, total) + " de " + total;
    }

    document.getElementById("anterior").disabled = paginaAtual <= 0;
    document.getElementById("proxima").disabled =
        paginaAtual + (mobile ? 1 : 2) >= total;
}

function avancar() {
    const mobile = window.matchMedia("(max-width: 850px)").matches;
    const passo = mobile ? 1 : 2;

    if (paginaAtual + passo < paginas.length) {
        paginaAtual += passo;
        renderizar();
    }
}

function voltar() {
    const mobile = window.matchMedia("(max-width: 850px)").matches;
    const passo = mobile ? 1 : 2;

    paginaAtual = Math.max(0, paginaAtual - passo);
    renderizar();
}

document.getElementById("proxima").addEventListener("click", avancar);
document.getElementById("anterior").addEventListener("click", voltar);

document.addEventListener("keydown", event => {
    if (event.key === "ArrowRight") avancar();
    if (event.key === "ArrowLeft") voltar();
});

window.addEventListener("resize", () => {
    clearTimeout(temporizadorRedimensionamento);
    temporizadorRedimensionamento = setTimeout(() => {
        paginaAtual = 0;
        paginar();
    }, 180);
});

window.addEventListener("load", paginar);
</script>
