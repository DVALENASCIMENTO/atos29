# O SONHO DURANTE O TEMPO DE BUSCA

const configuracao = {
    titulo: "O SONHO DOS CINCO NÍVEIS",
    capitulo: "CAPÍTULO 3",
    autor: "Ministério Atalaia • Diego Nascimento — Pastor Evangelista",
    caracteresPorPagina: 3300
};

const linhas = textoOriginal
    .split("\n")
    .map(linha => linha.trim())
    .filter(Boolean);

const blocos = [];

for (const linha of linhas) {
    if (linha.startsWith("# ")) {
        blocos.push({
            tipo: "titulo",
            texto: linha.replace(/^#\s*/, "")
        });
    } else {
        const separador = linha.indexOf("|");
        if (separador > -1) {
            blocos.push({
                tipo: "paragrafo",
                numero: linha.slice(0, separador),
                texto: linha.slice(separador + 1)
            });
        }
    }
}

/*
  Distribuição automática: cada página recebe uma sequência de blocos.
  O texto não é descartado nem encurtado. Os parágrafos são mantidos
  inteiros, e os títulos permanecem junto ao conteúdo subsequente.
*/

function calcularPaginas() {
    const paginas = [];
    let paginaAtual = [];
    let totalCaracteres = 0;

    const limite = configuracao.caracteresPorPagina;

    blocos.forEach((bloco, indice) => {
        const tamanho = bloco.texto.length + 35;

        if (
            totalCaracteres + tamanho > limite &&
            paginaAtual.length > 0 &&
            bloco.tipo !== "titulo"
        ) {
            paginas.push(paginaAtual);
            paginaAtual = [];
            totalCaracteres = 0;
        }

        if (
            bloco.tipo === "titulo" &&
            totalCaracteres > limite * .78
        ) {
            paginas.push(paginaAtual);
            paginaAtual = [];
            totalCaracteres = 0;
        }

        paginaAtual.push(bloco);
        totalCaracteres += tamanho;

        if (indice === blocos.length - 1) {
            paginas.push(paginaAtual);
        }
    });

    if (paginaAtual.length && paginas[paginas.length - 1] !== paginaAtual) {
        paginas.push(paginaAtual);
    }

    return paginas.filter(p => p.length);
}

const paginas = calcularPaginas();

function escaparHTML(texto) {
    return texto
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatarTexto(texto) {
    let seguro = escaparHTML(texto);

    /*
      Destaca citações entre aspas e preserva a referência bíblica
      que aparece imediatamente depois da citação.
    */
    seguro = seguro.replace(
        /“([^”]+)”/g,
        '<span class="citacao">“$1”</span>'
    );

    return seguro;
}

function montarConteudo(blocosPagina, numeroPagina) {
    let html = "";

    if (numeroPagina === 0) {
        html += `
            <div class="titulo-capitulo">
                <span class="livro-nome">ATOS 29</span>
                <span class="numero-capitulo">${configuracao.capitulo}</span>
                <h2>${configuracao.titulo}</h2>
                <span class="autor">${configuracao.autor}</span>
            </div>
        `;
    }

    for (const bloco of blocosPagina) {
        if (bloco.tipo === "titulo") {
            if (bloco.texto === "FIM DO CAPÍTULO" ||
                bloco.texto === "ATOS 29 CONTINUA") {
                html += `<h3 class="subtitulo">${escaparHTML(bloco.texto)}</h3>`;
            } else {
                html += `<h3 class="subtitulo">${escaparHTML(bloco.texto)}</h3>`;
            }
        } else {
            html += `
                <p class="paragrafo">
                    <sup class="numero">${escaparHTML(bloco.numero)}</sup>
                    ${formatarTexto(bloco.texto)}
                </p>
            `;
        }
    }

    return html;
}

function criarPagina(elemento, numero, classe) {
    const blocosPagina = paginas[numero];

    if (!blocosPagina) {
        elemento.className = "pagina " + classe + " vazia";
        elemento.innerHTML = "";
        return;
    }

    elemento.className = "pagina " + classe + " animar";

    elemento.innerHTML = `
        <div class="cabecalho-pagina">
            <span>ATOS 29 • A HISTÓRIA CONTINUA</span>
            <span>CAPÍTULO 3</span>
        </div>

        <div class="conteudo-pagina">
            ${montarConteudo(blocosPagina, numero)}
        </div>

        <div class="rodape-pagina">
            <span>MINISTÉRIO ATALAIA</span>
            <span>${numero + 1}</span>
        </div>
    `;
}

let indiceAtual = 0;

const paginaEsquerda = document.getElementById("paginaEsquerda");
const paginaDireita = document.getElementById("paginaDireita");
const paginaMovel = document.getElementById("paginaMovel");

const botaoAnterior = document.getElementById("anterior");
const botaoProxima = document.getElementById("proxima");
const indicador = document.getElementById("indicador");

function ehCelular() {
    return window.matchMedia("(max-width: 760px)").matches;
}

function atualizarLivro() {
    if (ehCelular()) {
        paginaEsquerda.style.display = "none";
        paginaDireita.style.display = "none";
        paginaMovel.style.display = "block";

        criarPagina(paginaMovel, indiceAtual, "movel");

        indicador.textContent =
            `Página ${indiceAtual + 1} de ${paginas.length}`;

        botaoAnterior.disabled = indiceAtual === 0;
        botaoProxima.disabled = indiceAtual >= paginas.length - 1;

    } else {
        paginaMovel.style.display = "none";
        paginaEsquerda.style.display = "block";
        paginaDireita.style.display = "block";

        const par = Math.floor(indiceAtual / 2) * 2;

        criarPagina(paginaEsquerda, par, "esquerda");
        criarPagina(paginaDireita, par + 1, "direita");

        indicador.textContent =
            `Páginas ${par + 1}–${Math.min(par + 2, paginas.length)} de ${paginas.length}`;

        botaoAnterior.disabled = par === 0;
        botaoProxima.disabled = par + 2 >= paginas.length;
    }
}

function avancar() {
    if (ehCelular()) {
        if (indiceAtual < paginas.length - 1) {
            indiceAtual++;
        }
    } else {
        const par = Math.floor(indiceAtual / 2) * 2;
        if (par + 2 < paginas.length) {
            indiceAtual = par + 2;
        }
    }

    atualizarLivro();
}

function voltar() {
    if (ehCelular()) {
        if (indiceAtual > 0) {
            indiceAtual--;
        }
    } else {
        const par = Math.floor(indiceAtual / 2) * 2;
        if (par > 0) {
            indiceAtual = par - 2;
        }
    }

    atualizarLivro();
}

botaoAnterior.addEventListener("click", voltar);
botaoProxima.addEventListener("click", avancar);

document.addEventListener("keydown", evento => {
    if (evento.key === "ArrowRight") avancar();
    if (evento.key === "ArrowLeft") voltar();
});

window.addEventListener("resize", atualizarLivro);

atualizarLivro();
</script>
