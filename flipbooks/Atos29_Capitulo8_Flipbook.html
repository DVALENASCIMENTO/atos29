<title>ATOS 29 — Capítulo 8 | A Mulher com Câncer no Olho</title>

<style>
:root {

}

* {

}

body {
    margin: 0;
    min-height: 100vh;
    background:

    color: #eee5d3;
    font-family: Georgia, "Times New Roman", serif;
}

.topo {
    text-align: center;
    padding: 22px 12px 15px;
}

.topo h1 {
    margin: 0;
    font-size: 17px;
    letter-spacing: 3px;
    font-weight: normal;
    color: #e8dcc4;
}

.topo p {
    margin: 7px 0 0;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: #b7a991;
    text-transform: uppercase;
}

.area-livro {
    width: 100%;
    padding: 10px 18px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.livro {
    display: flex;
    justify-content: center;
    align-items: stretch;
    perspective: 1800px;
    filter: drop-shadow(0 20px 22px rgba(0,0,0,.48));
}

.pagina {
    position: relative;
    width: min(var(--largura-pagina), calc((100vw - 60px) / 2));
    height: min(var(--altura-pagina), calc(100vh - 180px));
    min-height: 540px;
    padding: 34px 31px 43px;
    overflow: hidden;
    color: var(--tinta);
    background:
        radial-gradient(ellipse at 15% 10%, rgba(255,255,255,.27), transparent 40%),
        radial-gradient(ellipse at 90% 85%, rgba(145,111,60,.08), transparent 45%),
        repeating-linear-gradient(0deg, rgba(95,72,40,.018) 0px, rgba(95,72,40,.018) 1px, transparent 1px, transparent 4px),
        var(--papel);
    border: 1px solid rgba(100,75,42,.28);
}

.pagina.esquerda {
    border-radius: 5px 0 0 5px;
    box-shadow: inset -13px 0 18px -17px #3a2917;
}

.pagina.direita {
    border-radius: 0 5px 5px 0;
    box-shadow: inset 13px 0 18px -17px #3a2917;
}

.lombada {
    width: 15px;
    flex: 0 0 15px;
    background:
        linear-gradient(90deg,
        #4a3928 0%,
        #b6a17b 18%,
        #4e3b27 45%,
        #2b2118 55%,
        #b29a70 82%,
        #463423 100%);

}

.cabecalho-pagina {
    position: absolute;
    top: 15px;
    left: 30px;
    right: 30px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--linha);
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: #594a35;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
}

.miolo {
    position: absolute;
    top: 43px;
    bottom: 42px;
    left: 31px;
    right: 31px;
    overflow: hidden;
    column-count: 2;
    column-gap: 24px;
    column-rule: 1px solid rgba(92,72,43,.13);
    column-fill: auto;
    font-size: 12px;
    line-height: 1.48;
    text-align: justify;
    hyphens: auto;
}

.miolo p {
    margin: 0 0 6px;
    break-inside: avoid;
    page-break-inside: avoid;
}

.miolo .numero {
    display: inline;
    vertical-align: super;
    font-size: 8px;
    line-height: 0;
    font-weight: bold;
    margin-right: 2px;
    color: #5b482e;
}

.miolo .titulo-capitulo {
    column-span: all;
    text-align: center;
    font-size: 15px;
    line-height: 1.35;
    font-weight: bold;
    letter-spacing: .7px;
    margin: 7px 0 13px;
    text-transform: uppercase;
    break-after: avoid;
}

.miolo .credito {
    column-span: all;
    text-align: center;
    font-size: 9px;
    letter-spacing: .6px;
    margin: 0 0 18px;
    color: #65543b;
    font-style: italic;
}

.miolo h2 {
    font-size: 11px;
    line-height: 1.35;
    font-weight: bold;
    letter-spacing: .35px;
    text-align: left;
    text-transform: uppercase;
    margin: 12px 0 7px;
    break-after: avoid;
    break-inside: avoid;
}

.miolo .citacao {
    margin: 7px 8px 3px;
    padding-left: 8px;
    border-left: 1px solid rgba(90,69,41,.4);
    font-style: italic;
    text-align: left;
    break-inside: avoid;
}

.miolo .referencia {
    margin: 0 8px 8px;
    font-size: 10px;
    font-weight: bold;
    text-align: right;
    break-inside: avoid;
}

.miolo .destaque {
    font-weight: bold;
}

.miolo .abertura {
    column-span: all;
}

.rodape-pagina {
    position: absolute;
    bottom: 14px;
    left: 30px;
    right: 30px;
    padding-top: 7px;
    border-top: 1px solid var(--linha);
    display: flex;
    justify-content: space-between;
    color: #65543b;
    font-size: 9px;
    letter-spacing: 1px;
}

.controles {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 12px 12px 22px;
    font-family: Arial, sans-serif;
}

.controles button {
    border: 1px solid #8e7959;
    background: linear-gradient(#554633, #30261b);
    color: #f1e5ce;
    padding: 11px 22px;
    border-radius: 3px;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background .2s, transform .2s, opacity .2s;
}

.controles button:hover:not(:disabled) {
    background: #705a3d;
    transform: translateY(-1px);
}

.controles button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.contador {
    min-width: 110px;
    text-align: center;
    color: #d7c8ad;
    font-size: 11px;
    letter-spacing: 1px;
}

.animar-proxima {
    animation: virarDireita .32s ease;
}

.animar-anterior {
    animation: virarEsquerda .32s ease;
}

@keyframes virarDireita {
    0% { transform: rotateY(-3deg); opacity: .75; }
    100% { transform: rotateY(0); opacity: 1; }
}

@keyframes virarEsquerda {
    0% { transform: rotateY(3deg); opacity: .75; }
    100% { transform: rotateY(0); opacity: 1; }
}

/* Área invisível utilizada para calcular a paginação */
#medidor {
    position: fixed;
    left: -10000px;
    top: 0;
    visibility: hidden;
    pointer-events: none;
}

#medidor .pagina {
    width: var(--largura-pagina);
    height: var(--altura-pagina);
}

@media (max-width: 850px) {
    :root {
        --largura-pagina: 520px;
        --altura-pagina: 720px;
    }

    .pagina {
        width: min(520px, calc(100vw - 30px));
        height: min(720px, calc(100vh - 165px));
        min-height: 480px;
    }

    .pagina.esquerda,
    .pagina.direita {
        border-radius: 5px;
    }

    .lombada {
        display: none;
    }

    .pagina.oculta {
        display: none;
    }
}

@media (max-width: 520px) {
    .topo {
        padding-top: 17px;
    }

    .topo h1 {
        font-size: 14px;
        letter-spacing: 2px;
    }

    .area-livro {
        padding: 5px 10px 10px;
    }

    .pagina {
        width: calc(100vw - 24px);
        height: calc(100dvh - 175px);
        min-height: 420px;
        padding: 32px 22px 42px;
    }

    .cabecalho-pagina {
        left: 21px;
        right: 21px;
        font-size: 8px;
    }

    .miolo {
        left: 22px;
        right: 22px;
        column-gap: 15px;
        font-size: 11.5px;
        line-height: 1.48;
    }

    .miolo .titulo-capitulo {
        font-size: 14px;
    }

    .rodape-pagina {
        left: 21px;
        right: 21px;
    }

    .controles {
        gap: 8px;
        padding-top: 8px;
    }

    .controles button {
        padding: 10px 13px;
        font-size: 10px;
    }

    .contador {
        min-width: 85px;
        font-size: 10px;
    }
}

@media (max-height: 650px) and (min-width: 851px) {
    .pagina {
        height: calc(100vh - 150px);
        min-height: 440px;
    }
}
</style>
</head>

<script>
/*
    ATOS 29 — A HISTÓRIA CONTINUA

const conteudo = [
    {tipo:"titulo", texto:"CAPÍTULO 8 — A MULHER COM CÂNCER NO OLHO"},
    {tipo:"credito", texto:"Ministério Atalaia • Diego Nascimento — Pastor Evangelista"},

    {tipo:"subtitulo", texto:"UMA DAS PRIMEIRAS EXPERIÊNCIAS"},
    {tipo:"p", n:"¹", texto:"Uma das primeiras experiências que marcaram minha caminhada cristã aconteceu quando eu ainda era um novo convertido."},

    {tipo:"p", n:"³", texto:"Naquele período, estávamos começando a conhecer mais profundamente a vida cristã e a aprender a confiar em Deus."},
    {tipo:"p", n:"⁴", texto:"Certo dia, uma irmã da igreja chegou apressadamente pedindo que fôssemos visitar uma senhora que se encontrava em estado gravíssimo."},
    {tipo:"p", n:"⁵", texto:"Ela precisava de oração."},
    {tipo:"p", n:"⁶", texto:"Disseram-nos que aquela mulher estava morrendo em consequência de um câncer que havia atingido um dos seus olhos."},
    {tipo:"p", n:"⁷", texto:"Então fomos até sua casa."},
    {tipo:"p", n:"⁸", texto:"Eu ainda era novo convertido."},

    {tipo:"p", n:"¹⁰", texto:"Mas naquela ocasião aprendi uma das lições que jamais esqueci:"},
    {tipo:"p", n:"¹¹", texto:"quando não temos recursos humanos para resolver uma situação, ainda podemos colocar aquela situação diante de Deus.", destaque:true},

    {tipo:"subtitulo", texto:"UMA CENA QUE JAMAIS ESQUECI"},
    {tipo:"p", n:"¹²", texto:"Quando chegamos à sua casa, encontramos uma cena que jamais esquecerei."},
    {tipo:"p", n:"¹³", texto:"O tumor havia crescido de tal maneira que uma grande massa de carne saía da cavidade do olho."},
    {tipo:"p", n:"¹⁴", texto:"Seu esposo estava ao seu lado, despedindo-se dela, acreditando que aqueles seriam seus últimos momentos."},
    {tipo:"p", n:"¹⁵", texto:"Ela estava consumida por uma febre muito alta e gemia de dor."},
    {tipo:"p", n:"¹⁶", texto:"A situação diante dos nossos olhos era extremamente grave."},
    {tipo:"p", n:"¹⁷", texto:"Não havia, naquele momento, recursos humanos que pudéssemos oferecer para solucionar aquela situação."},
    {tipo:"p", n:"¹⁸", texto:"Éramos apenas servos de Deus diante de uma mulher enferma."},
    {tipo:"p", n:"¹⁹", texto:"Mas tínhamos algo que podíamos fazer:"},
    {tipo:"p", n:"²⁰", texto:"orar.", destaque:true},

    {tipo:"subtitulo", texto:"COMEÇAMOS A LOUVAR"},
    {tipo:"p", n:"²¹", texto:"Em vez de olharmos apenas para a gravidade da enfermidade, começamos a louvar a Deus."},
    {tipo:"p", n:"²²", texto:"Começamos a entoar cânticos."},
    {tipo:"p", n:"²³", texto:"Enquanto adorávamos, algo começou a acontecer naquele ambiente."},
    {tipo:"p", n:"²⁴", texto:"A presença do Espírito Santo encheu aquele lugar de uma maneira tão intensa que nenhum de nós conseguia conter as lágrimas."},
    {tipo:"p", n:"²⁵", texto:"Chorávamos diante da presença de Deus.", destaque:true},
    {tipo:"p", n:"²⁶", texto:"Não estávamos diante de uma situação comum."},
    {tipo:"p", n:"²⁷", texto:"Estávamos diante de uma mulher sofrendo."},
    {tipo:"p", n:"²⁸", texto:"Diante de uma família aflita."},
    {tipo:"p", n:"²⁹", texto:"Diante de uma enfermidade que parecia ter chegado ao seu limite."},

    {tipo:"subtitulo", texto:"A FEBRE DESAPARECEU"},

    {tipo:"p", n:"³³", texto:"Seu semblante começou a mudar."},

    {tipo:"p", n:"³⁹", texto:"A Bíblia declara:"},

    {tipo:"p", n:"⁴¹", texto:"O Deus que encontramos nas páginas das Escrituras não é um Deus distante."},

    {tipo:"subtitulo", texto:"DEUS É QUEM OPERA"},

    {tipo:"p", n:"⁵¹", texto:"Pode interceder."},
    {tipo:"p", n:"⁵²", texto:"Mas quem opera é Deus."},
    {tipo:"p", n:"⁵³", texto:"A Palavra diz:"},
    {tipo:"citacao", n:"⁵⁴", texto:"“Eu sou o Senhor que te sara.”", referencia:"Êxodo 15:26"},
    {tipo:"p", n:"⁵⁵", texto:"E o salmista declara:"},
    {tipo:"citacao", n:"⁵⁶", texto:"“É ele que perdoa todas as tuas iniquidades e sara todas as tuas enfermidades.”", referencia:"Salmo 103:3"},
    {tipo:"p", n:"⁵⁷", texto:"Quando oramos por alguém, nossa confiança não deve estar na pessoa que ora."},

    {tipo:"subtitulo", texto:"UM DIA ELA VOLTOU"},

/* Cria os elementos de cada unidade editorial */
function criarUnidade(item) {
    let elemento;

    if (item.tipo === "titulo") {
        elemento = document.createElement("div");
        elemento.className = "titulo-capitulo";
        elemento.textContent = item.texto;
        return elemento;
    }

    if (item.tipo === "credito") {
        elemento = document.createElement("div");
        elemento.className = "credito";
        elemento.textContent = item.texto;
        return elemento;
    }

    if (item.tipo === "subtitulo") {
        elemento = document.createElement("h2");
        elemento.textContent = item.texto;
        return elemento;
    }

    if (item.tipo === "citacao") {
        const grupo = document.createElement("div");
        grupo.className = "grupo-citacao";

        const citacao = document.createElement("p");
        citacao.className = "citacao";
        citacao.innerHTML = `<span class="numero">${item.n}</span>${item.texto}`;

        const referencia = document.createElement("p");
        referencia.className = "referencia";
        referencia.textContent = "📖 " + item.referencia;

        grupo.appendChild(citacao);
        grupo.appendChild(referencia);
        return grupo;
    }

    elemento = document.createElement("p");
    if (item.destaque) elemento.classList.add("destaque");

    const numero = document.createElement("span");
    numero.className = "numero";
    numero.textContent = item.n;

    elemento.appendChild(numero);
    elemento.appendChild(document.createTextNode(item.texto));

    return elemento;
}

/* Cria a estrutura de uma página */
function criarPagina(numero, lado) {
    const pagina = document.createElement("section");
    pagina.className = `pagina ${lado}`;

    const cabecalho = document.createElement("div");
    cabecalho.className = "cabecalho-pagina";

    const esquerda = document.createElement("span");
    esquerda.textContent = "ATOS 29 • A HISTÓRIA CONTINUA";

    const direita = document.createElement("span");
    direita.textContent = "CAPÍTULO 8";

    cabecalho.append(esquerda, direita);

    const miolo = document.createElement("div");
    miolo.className = "miolo";

    const rodape = document.createElement("div");
    rodape.className = "rodape-pagina";

    const instituicao = document.createElement("span");
    instituicao.textContent = "MINISTÉRIO ATALAIA";

    const numeroPagina = document.createElement("span");
    numeroPagina.textContent = numero;

    rodape.append(instituicao, numeroPagina);
    pagina.append(cabecalho, miolo, rodape);

    return {pagina, miolo};
}

/*
    Paginação automática:
    O navegador calcula a ocupação das duas colunas.
    Quando o conteúdo ultrapassa a largura disponível,
    a unidade é transferida integralmente para a página seguinte.
*/
function calcularPaginas() {
    const medidor = document.getElementById("medidor");
    medidor.innerHTML = "";

    const paginas = [];
    let unidades = [];

    let estrutura = criarPagina("", "direita");
    medidor.appendChild(estrutura.pagina);

    function finalizarPagina() {
        if (unidades.length) {
            paginas.push(unidades);
        }
        unidades = [];
    }

    conteudo.forEach(item => {
        const unidade = criarUnidade(item);
        estrutura.miolo.appendChild(unidade);

        const ultrapassou =
            estrutura.miolo.scrollWidth > estrutura.miolo.clientWidth + 2;

        if (ultrapassou && unidades.length > 0) {
            estrutura.miolo.removeChild(unidade);
            finalizarPagina();

            medidor.removeChild(estrutura.pagina);
            estrutura = criarPagina("", "direita");
            medidor.appendChild(estrutura.pagina);

            estrutura.miolo.appendChild(unidade);
            unidades.push(item);
        } else {
            unidades.push(item);
        }
    });

    finalizarPagina();
    medidor.innerHTML = "";

    return paginas;
}

let paginas = [];
let paginaAtual = 0;
let modoCelular = window.matchMedia("(max-width: 850px)");

const paginaEsquerda = document.getElementById("paginaEsquerda");
const paginaDireita = document.getElementById("paginaDireita");
const contador = document.getElementById("contador");
const botaoAnterior = document.getElementById("anterior");
const botaoProxima = document.getElementById("proxima");

function preencherPagina(destino, unidades, numero, lado) {
    const estrutura = criarPagina(numero, lado);
    destino.replaceWith(estrutura.pagina);
    destino = estrutura.pagina;

    unidades.forEach(item => {
        estrutura.miolo.appendChild(criarUnidade(item));
    });

    return destino;
}

function atualizarLivro(animacao = "") {
    const celular = modoCelular.matches;

    let esquerdaIndex;
    let direitaIndex;

    if (celular) {
        esquerdaIndex = paginaAtual;
        direitaIndex = -1;
    } else {
        esquerdaIndex = paginaAtual;
        direitaIndex = paginaAtual + 1;
    }

    if (celular) {
        const dados = paginas[esquerdaIndex] || [];
        const numero = esquerdaIndex + 1;

        const nova = criarPagina(numero, "direita");
        dados.forEach(item => nova.miolo.appendChild(criarUnidade(item)));

        paginaEsquerda.replaceWith(nova.pagina);
        paginaDireita.style.display = "none";

        const livro = document.getElementById("livro");
        livro.innerHTML = "";
        livro.appendChild(nova.pagina);
    } else {
        const esquerda = criarPagina(
            esquerdaIndex + 1,
            "esquerda"
        );

        (paginas[esquerdaIndex] || []).forEach(item => {
            esquerda.miolo.appendChild(criarUnidade(item));
        });

        const direita = criarPagina(
            direitaIndex + 1,
            "direita"
        );

        (paginas[direitaIndex] || []).forEach(item => {
            direita.miolo.appendChild(criarUnidade(item));
        });

        const livro = document.getElementById("livro");
        livro.innerHTML = "";

        livro.appendChild(esquerda.pagina);

        const lombada = document.createElement("div");
        lombada.className = "lombada";
        livro.appendChild(lombada);

        if (direitaIndex < paginas.length) {
            livro.appendChild(direita.pagina);
        } else {
            const paginaVazia = criarPagina("", "direita");
            livro.appendChild(paginaVazia.pagina);
        }
    }

    const totalVisivel = celular ? paginas.length : Math.ceil(paginas.length / 2);
    const paginaExibida = celular
        ? paginaAtual + 1
        : Math.min(paginaAtual + 1, paginas.length);

    contador.textContent = celular
        ? `Página ${paginaExibida} de ${paginas.length}`
        : `Páginas ${paginaExibida}–${Math.min(paginaAtual + 2, paginas.length)} de ${paginas.length}`;

    botaoAnterior.disabled = paginaAtual <= 0;
    botaoProxima.disabled = celular
        ? paginaAtual >= paginas.length - 1
        : paginaAtual + 2 >= paginas.length;

    const livro = document.getElementById("livro");
    livro.classList.remove("animar-proxima", "animar-anterior");

    if (animacao) {
        void livro.offsetWidth;
        livro.classList.add(animacao);
    }
}

function avancar() {
    const passo = modoCelular.matches ? 1 : 2;
    const limite = modoCelular.matches
        ? paginas.length - 1
        : paginas.length - 2;

    if (paginaAtual < limite) {
        paginaAtual += passo;
        atualizarLivro("animar-proxima");
    }
}

function voltar() {
    const passo = modoCelular.matches ? 1 : 2;

    if (paginaAtual > 0) {
        paginaAtual = Math.max(0, paginaAtual - passo);
        atualizarLivro("animar-anterior");
    }
}

botaoAnterior.addEventListener("click", voltar);
botaoProxima.addEventListener("click", avancar);

document.addEventListener("keydown", evento => {
    if (evento.key === "ArrowRight") avancar();
    if (evento.key === "ArrowLeft") voltar();
});

/* Recalcula a diagramação quando a tela muda de tamanho */
let temporizadorRedimensionamento;

window.addEventListener("resize", () => {
    clearTimeout(temporizadorRedimensionamento);

    temporizadorRedimensionamento = setTimeout(() => {
        const estavaNoCelular = modoCelular.matches;
        const novaPagina = modoCelular.matches ? paginaAtual : paginaAtual;

        paginas = calcularPaginas();

        if (modoCelular.matches) {
            paginaAtual = Math.min(novaPagina, paginas.length - 1);
        } else {
            paginaAtual = Math.min(
                Math.floor(novaPagina / 2) * 2,
                Math.max(0, paginas.length - 1)
            );
        }

        atualizarLivro();
    }, 250);
});

/* Inicialização */
function iniciarFlipbook() {
    paginas = calcularPaginas();

    if (!paginas.length) {
        paginas = [[]];
    }

    paginaAtual = 0;
    atualizarLivro();
}

window.addEventListener("load", iniciarFlipbook);
