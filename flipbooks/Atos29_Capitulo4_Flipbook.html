# EPIGRAFE
1|“Do seu interior fluirão rios de água viva.”

# JESUS E OS RIOS DE ÁGUA VIVA
2|Há experiências que são difíceis de explicar apenas com palavras. Esta é uma delas. Eu estava desperto, sentado na cama e encostado na parede, quando tive essa experiência. Não estava dormindo. Abriu-se uma visão de um lugar muito iluminado. Vi uma figura de homem vestido de branco, com cabelos longos e brancos. Não vi o seu rosto.
3|Ele estendeu as mãos em minha direção e, delas, saíram rios de água muito forte que vieram sobre o meu ventre. Eu senti as águas no meu ventre e me assustei. Quando olhei para o meu ventre, a visão acabou, mas continuei sentindo a força das águas. Foi isso que eu vi.
4|A experiência ficou profundamente marcada em minha memória. Posteriormente, ao recordar aquilo que havia acontecido, associei a experiência às palavras de Jesus registradas no Evangelho de João:
5|“Quem crê em mim, como diz a Escritura, do seu interior fluirão rios de água viva.” João 7:38

# QUANDO A EXPERIÊNCIA ENCONTRA A PALAVRA
6|A experiência não substitui a Escritura. É a Palavra de Deus que permanece como fundamento e referência. João 7:38 apresenta a imagem dos rios de água viva no contexto daqueles que creem em Jesus. Ao recordar aquilo que vivi, essa passagem tornou-se especialmente marcante para mim.
7|Não quero acrescentar à experiência aquilo que não aconteceu, nem afirmar detalhes que não foram relatados. O que posso testemunhar é aquilo que vi: Uma figura de homem vestida de branco, com cabelos longos e brancos, estendendo as mãos, e rios de água vindo sobre o meu ventre. Não vi o seu rosto.
8|Mas, com o passar do tempo, comecei a buscar nas Escrituras uma compreensão mais profunda daquela experiência. E foi nesse processo que uma convicção se estabeleceu dentro de mim.

# JESUS E AS ÁGUAS COMO O ESPÍRITO SANTO
9|Depois de refletir sobre essa experiência à luz das Escrituras, cheguei a uma convicção pessoal muito clara: Para mim, aquela figura era Jesus. Eu não vi o rosto daquela figura. Isso continua fazendo parte do meu testemunho e não quero acrescentar à experiência aquilo que não aconteceu.
10|Porém, aquilo que vi — um homem vestido de branco, com cabelos longos e brancos, em um lugar muito iluminado, estendendo as mãos em minha direção — encontrou, posteriormente, uma correspondência muito forte com aquilo que as Escrituras apresentam sobre Cristo glorificado. O primeiro elemento que me chamou a atenção foi a aparência.
11|Em Apocalipse 1:13-16, João descreve uma figura semelhante ao Filho do Homem, vestida com uma veste comprida. Ele afirma que a cabeça e os cabelos dessa figura eram brancos como lã e como neve. A passagem também descreve uma figura gloriosa, cuja aparência é extraordinária.
12|Quando li essa passagem e comparei com aquilo que havia visto, a semelhança da descrição me marcou profundamente. Na experiência, eu vi um homem vestido de branco e com cabelos longos e brancos. Não vi o rosto. Não ouvi uma apresentação dizendo quem Ele era.
13|Mas, ao longo do tempo, fui compreendendo aquela experiência à luz da Palavra e passei a ter a convicção de que era Jesus. E existe ainda outro elemento que, para mim, torna essa experiência ainda mais significativa: as águas.

# JESUS E OS RIOS DE ÁGUA VIVA
14|Em João 7:37-39, Jesus estava no último dia da festa quando se levantou e declarou:
15|“Se alguém tem sede, venha a mim e beba.”
16|Em seguida, Jesus falou sobre os rios de água viva:
17|“Quem crer em mim, como diz a Escritura, do seu interior fluirão rios de água viva.”
18|E João, ao registrar essas palavras, explica exatamente o que Jesus estava falando:
19|“Isto ele disse com respeito ao Espírito.”
20|Essa explicação do próprio evangelista é fundamental. Jesus falou sobre água viva, e João explicou que Ele estava falando sobre o Espírito. Por isso, quando recordo aqueles rios de água vindo das mãos daquela figura sobre o meu ventre, compreendo essas águas como uma representação do Espírito Santo. A experiência não me levou para longe de Cristo.
21|Ao contrário. Ela me fez lembrar exatamente daquilo que Cristo ensinou sobre a água viva. Jesus disse:
22|“Se alguém tem sede, venha a mim e beba.”
23|Depois declarou:
24|“Quem crer em mim, como diz a Escritura, do seu interior fluirão rios de água viva.”
25|E João esclareceu:
26|“Isto ele disse com respeito ao Espírito.”
27|Assim, na minha compreensão, existe uma relação muito significativa entre os dois elementos da experiência: A figura que reconheço como Jesus. E as águas que compreendo como o Espírito Santo.

# CRISTO, A ÁGUA VIVA E O ESPÍRITO SANTO
28|Essa compreensão também encontra correspondência em outras palavras de Jesus. Em João 4:14, Jesus falou à mulher samaritana sobre a água que Ele daria:
29|“A água que eu lhe der será nele uma fonte a jorrar para a vida eterna.”
30|Jesus não estava simplesmente falando de água física. Ele estava apresentando uma realidade espiritual. A água que Ele dá se torna uma fonte que conduz à vida eterna. Em João 7, novamente encontramos Jesus utilizando a imagem da água. Porém, dessa vez, a expressão é ainda mais forte: rios de água viva.
31|E o próprio texto explica que Jesus estava falando do Espírito Santo. Por isso, quando penso naquilo que aconteceu comigo, não compreendo aquelas águas apenas como água física. Compreendo-as espiritualmente. E compreendo-as como uma representação da ação e da presença do Espírito Santo.

# AS ÁGUAS QUE VINHAM DAS MÃOS
32|Existe ainda um detalhe da experiência que permaneceu muito forte na minha memória. As águas não simplesmente apareceram. Elas vieram das mãos daquela figura. Ele estendeu as mãos em minha direção. E delas saíram rios de água muito forte que vieram sobre o meu ventre.
33|Hoje, quando penso nisso à luz das Escrituras, vejo uma imagem que me conduz novamente a Cristo. Jesus é apresentado como aquele que oferece a água viva. Ele mesmo disse:
34|“Se alguém tem sede, venha a mim e beba.”
35|Essa frase de Jesus se tornou ainda mais significativa para mim depois daquela experiência. Eu não estava procurando interpretar a experiência naquele momento. Eu simplesmente estava vivendo aquilo. Vi as mãos. Vi as águas. Senti as águas. E depois a visão terminou.
36|Mas, posteriormente, quando voltei para as Escrituras, encontrei Jesus falando sobre água viva. E encontrei João explicando que Jesus estava falando sobre o Espírito. Por isso, essa passagem passou a ocupar um lugar muito especial na minha compreensão daquele acontecimento.

# O RIO DA ÁGUA DA VIDA
37|Existe ainda outra passagem das Escrituras que chama minha atenção. Em Apocalipse 22:1, João relata:
38|“Então, me mostrou o rio da água da vida, brilhante como cristal, que sai do trono de Deus e do Cordeiro.”
39|Aqui aparece novamente a imagem de um rio de água da vida. E esse rio está relacionado ao trono de Deus e do Cordeiro. A Bíblia apresenta, portanto, uma linguagem muito profunda envolvendo Deus, o Cordeiro e a água da vida. No final das Escrituras, João vê o rio da água da vida procedendo do trono de Deus e do Cordeiro.
40|Quando comparo isso com aquilo que vivi, não afirmo que minha experiência tenha a mesma autoridade ou natureza das revelações registradas na Bíblia. A Escritura continua sendo a Palavra de Deus e o fundamento. Mas não posso deixar de registrar a relação que encontrei posteriormente. Na experiência que tive: havia uma figura. havia mãos estendidas.
41|havia rios de água. as águas vieram sobre mim. E, nas Escrituras, encontrei: Jesus oferecendo água viva. Jesus falando de rios de água viva. João explicando que esses rios estavam relacionados ao Espírito. E Apocalipse apresentando o rio da água da vida ligado ao trono de Deus e do Cordeiro.
42|Essas relações fortaleceram profundamente minha compreensão daquilo que vivi.

# UMA CONVICÇÃO PESSOAL, FIRMADA NA ESCRITURA
43|Eu reconheço que não vi o rosto daquela figura. Essa informação continua fazendo parte do meu testemunho e não quero apagá-la. Não quero dizer que vi aquilo que não vi. Mas também não posso negar aquilo que vivi. Por isso, hoje posso registrar com clareza aquilo que creio: Para mim, era Jesus.
44|Minha certeza não nasce de uma tentativa de criar uma doutrina a partir de uma experiência pessoal. Ela nasce da maneira como, ao longo do tempo, essa experiência permaneceu associada às palavras de Cristo e encontrou correspondências significativas nas Escrituras. A experiência me levou de volta para a Bíblia. E a Bíblia me levou novamente para Cristo.
45|Por isso, mantenho uma ordem que considero essencial: Primeiro a Palavra. Depois o testemunho. A experiência é pessoal. A Escritura é o fundamento. E aquilo que vivi permanece como parte da minha caminhada de fé.

# UM TESTEMUNHO QUE PERMANECE
46|Nem todas as experiências da nossa caminhada podem ser explicadas completamente. Algumas simplesmente permanecem como acontecimentos que carregamos na memória. Esta é uma delas. Eu estava desperto. Vi. Senti. E aquela experiência ficou gravada em mim.
47|Ao longo do tempo, quando recordei o que havia acontecido, as palavras de Jesus em João 7:38 vieram à minha memória:
48|“Do seu interior fluirão rios de água viva.”
49|Não apresento essa experiência como substituta da Bíblia. Pelo contrário. Registro-a como um testemunho pessoal que me levou novamente à Palavra. Quanto mais voltei às Escrituras, mais compreendi que o centro da experiência não deveria ser a experiência em si. O centro deveria ser Cristo.

# A EXPERIÊNCIA ME CONDUZ A CRISTO
50|Jesus é o centro de João 7:38. Ele chama as pessoas para si. Ele diz:
51|“Se alguém tem sede, venha a mim e beba.”
52|Depois fala daquele que crê nele e dos rios de água viva. E João explica que Jesus estava falando do Espírito Santo. Isso é muito importante para mim. Porque, quando olho para aquela experiência, não quero ficar apenas pensando na figura, nas águas ou na visão. Quero olhar para aquilo para o qual a experiência me conduziu: Jesus. A experiência foi marcante.
53|A lembrança permanece. Mas a Palavra de Deus continua sendo o fundamento.

# A ÁGUA QUE JESUS DÁ
54|Jesus disse que aquele que beber da água que Ele dá terá dentro de si uma fonte que jorra para a vida eterna.
55|“A água que eu lhe der será nele uma fonte a jorrar para a vida eterna.” João 4:14
56|Essa palavra me faz compreender que a verdadeira fonte não está na experiência. A verdadeira fonte está em Cristo. A experiência apenas me fez lembrar de uma verdade que já estava registrada nas Escrituras. Jesus é aquele que dá a água. Jesus é aquele que chama o sedento. Jesus é aquele que fala dos rios de água viva.
57|E o evangelista João revela que essa linguagem estava relacionada ao Espírito Santo. Por isso, quando penso nas águas que vieram sobre mim, minha compreensão é que elas apontavam para essa realidade espiritual: o Espírito Santo.

# JESUS E O ESPÍRITO SANTO
58|Existe, portanto, uma relação que para mim se tornou muito clara. Jesus é a fonte. O Espírito Santo é apresentado por Cristo na imagem dos rios de água viva. E essa compreensão está diretamente ligada ao texto de João 7:37-39. Não estou dizendo que a minha experiência estabelece uma nova interpretação das Escrituras.
59|Estou dizendo que, ao confrontar aquilo que vivi com a Escritura, encontrei uma passagem que dialoga profundamente com aquilo que experimentei. Jesus falou sobre água. Eu vi águas. Jesus falou sobre rios de água viva. Eu vi rios de água. João explicou que Jesus estava falando sobre o Espírito.
60|E eu compreendi aquelas águas como uma representação do Espírito Santo. Para mim, essa relação não é algo que eu queira esconder ou diminuir. É parte da maneira como compreendi a experiência.

# EU VI JESUS
61|Há uma diferença entre dizer simplesmente: “Eu vi uma figura.” E registrar aquilo que, depois de refletir sobre as Escrituras, passei a crer. Naquele momento, eu vi uma figura. Não vi o rosto. Mas hoje, depois de tantos anos e depois de relacionar aquela experiência com a Palavra, posso registrar minha convicção: Eu creio que era Jesus.
62|A descrição dos cabelos brancos e da veste branca me faz lembrar a descrição do Filho do Homem em Apocalipse 1. As águas me fazem lembrar diretamente das palavras de Jesus em João 7. E João afirma que os rios de água viva estavam relacionados ao Espírito. Por isso, para mim, os dois elementos se unem: Jesus diante de mim.
63|O Espírito Santo representado pelas águas.

# NÃO QUERO ACRESCENTAR AO QUE VI

/* Converte o texto em blocos mantendo títulos e numeração. */
function lerBlocos(texto) {
    return texto.trim().split("\n").map(linha => linha.trim()).filter(Boolean).map(linha => {
        if (linha.startsWith("# ")) {
            return {
                tipo: linha === "# EPIGRAFE" ? "epigrafe" : "titulo",
                texto: linha.substring(2)
            };
        }

        const separador = linha.indexOf("|");

        if (separador !== -1) {
            return {
                tipo: "paragrafo",
                numero: linha.substring(0, separador),
                texto: linha.substring(separador + 1)
            };
        }

        return null;
    }).filter(Boolean);
}

const blocos = lerBlocos(textoOriginal);

/*
  A paginação agrupa blocos inteiros. Os parágrafos não são
  cortados no meio. Os títulos são mantidos junto ao texto seguinte.
*/
function calcularPaginas() {
    const resultado = [];
    let atual = [];
    let caracteres = 0;

    const limite = configuracao.caracteresPorPagina;

    for (let i = 0; i < blocos.length; i++) {
        const bloco = blocos[i];
        const tamanho = bloco.texto.length + 35;

        if (
            atual.length > 0 &&
            caracteres + tamanho > limite &&
            bloco.tipo !== "titulo"
        ) {
            resultado.push(atual);
            atual = [];
            caracteres = 0;
        }

        if (
            bloco.tipo === "titulo" &&
            atual.length > 0 &&
            caracteres > limite * .78
        ) {
            resultado.push(atual);
            atual = [];
            caracteres = 0;
        }

        atual.push(bloco);
        caracteres += tamanho;
    }

    if (atual.length) resultado.push(atual);

    return resultado;
}

const paginas = calcularPaginas();

function escaparHTML(texto) {
    return texto
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* Destaca somente as palavras entre aspas, sem modificar o texto. */
function formatarTexto(texto) {
    const seguro = escaparHTML(texto);

    return seguro.replace(
        /“([^”]+)”/g,
        '<span class="citacao">“$1”</span>'
    );
}

function montarConteudo(blocosPagina, numeroPagina) {
    let html = "";

    if (numeroPagina === 0) {
        html += `
            <div class="abertura">
                <span class="nome-livro">ATOS 29</span>
                <span class="numero-capitulo">${configuracao.capitulo}</span>
                <h2>${configuracao.titulo}</h2>
                <span class="autor">${configuracao.autor}</span>
                <div class="referencia-inicial">${configuracao.referencia}</div>
            </div>
        `;
    }

    for (const bloco of blocosPagina) {
        if (bloco.tipo === "epigrafe") {
            html += `
                <div class="epigrafe">
                    ${formatarTexto(bloco.texto)}
                    <div class="referencia-inicial">João 7:38</div>
                </div>
            `;
        } else if (bloco.tipo === "titulo") {
            html += `<h3 class="titulo-secao">${escaparHTML(bloco.texto)}</h3>`;
        } else {
            html += `
                <p class="paragrafo">
                    <sup class="numero-versiculo">${escaparHTML(bloco.numero)}</sup>
                    ${formatarTexto(bloco.texto)}
                </p>
            `;
        }
    }

    return html;
}

function criarPagina(elemento, numero, classe) {
    if (!paginas[numero]) {
        elemento.className = "pagina " + classe + " vazia";
        elemento.innerHTML = "";
        return;
    }

    elemento.className = "pagina " + classe + " animar";

    elemento.innerHTML = `
        <div class="cabecalho-pagina">
            <span>ATOS 29 • A HISTÓRIA CONTINUA</span>
            <span>CAPÍTULO 4</span>
        </div>

        <div class="conteudo">
            ${montarConteudo(paginas[numero], numero)}
        </div>

        <div class="rodape-pagina">
            <span>MINISTÉRIO ATALAIA</span>
            <span>${numero + 1}</span>
        </div>
    `;
}

let indiceAtual = 0;

const paginaEsquerda = document.getElementById("paginaEsquerda");
const paginaDireita = document.getElementById("paginaDireita");
const paginaMovel = document.getElementById("paginaMovel");

const botaoAnterior = document.getElementById("anterior");
const botaoProxima = document.getElementById("proxima");
const indicador = document.getElementById("indicador");

function ehCelular() {
    return window.matchMedia("(max-width: 760px)").matches;
}

function atualizarLivro() {
    if (ehCelular()) {
        paginaEsquerda.style.display = "none";
        paginaDireita.style.display = "none";
        paginaMovel.style.display = "block";

        criarPagina(paginaMovel, indiceAtual, "movel");

        indicador.textContent =
            `Página ${indiceAtual + 1} de ${paginas.length}`;

        botaoAnterior.disabled = indiceAtual === 0;
        botaoProxima.disabled = indiceAtual >= paginas.length - 1;

    } else {
        paginaMovel.style.display = "none";
        paginaEsquerda.style.display = "block";
        paginaDireita.style.display = "block";

        const par = Math.floor(indiceAtual / 2) * 2;

        criarPagina(paginaEsquerda, par, "esquerda");
        criarPagina(paginaDireita, par + 1, "direita");

        indicador.textContent =
            `Páginas ${par + 1}–${Math.min(par + 2, paginas.length)} de ${paginas.length}`;

        botaoAnterior.disabled = par === 0;
        botaoProxima.disabled = par + 2 >= paginas.length;
    }
}

function avancar() {
    if (ehCelular()) {
        if (indiceAtual < paginas.length - 1) {
            indiceAtual++;
        }
    } else {
        const par = Math.floor(indiceAtual / 2) * 2;

        if (par + 2 < paginas.length) {
            indiceAtual = par + 2;
        }
    }

    atualizarLivro();
}

function voltar() {
    if (ehCelular()) {
        if (indiceAtual > 0) {
            indiceAtual--;
        }
    } else {
        const par = Math.floor(indiceAtual / 2) * 2;

        if (par > 0) {
            indiceAtual = par - 2;
        }
    }

    atualizarLivro();
}

botaoAnterior.addEventListener("click", voltar);
botaoProxima.addEventListener("click", avancar);

document.addEventListener("keydown", evento => {
    if (evento.key === "ArrowRight") avancar();
    if (evento.key === "ArrowLeft") voltar();
});

window.addEventListener("resize", atualizarLivro);

atualizarLivro();
</script>
