    { tipo: "paragrafo", numero: 12, texto: "Algum tempo depois, minha compromissada recebeu uma ligação informando que sua mãe estava muito mal e que a família acreditava que ela estava vivendo seus últimos momentos." },

    { tipo: "paragrafo", numero: 13, texto: "Diante daquela notícia, imediatamente pedi a um amigo que nos levasse de carro até a casa onde ela se encontrava." },

    { tipo: "paragrafo", numero: 14, texto: "Precisávamos estar ali." },

    { tipo: "paragrafo", numero: 34, texto: "Ao registrar esse testemunho, quero preservar justamente essa parte da história: a oração aconteceu, a febre desapareceu durante aquele momento de oração, e ela continuou realizando o tratamento médico necessário até a cura do câncer." },

/* =====================================================
   CONVERSÃO SEGURA DOS BLOCOS EM HTML
===================================================== */

function escaparHTML(texto) {
    return String(texto).replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[caractere]);
}

function criarHTML(item) {

    if (item.tipo === "titulo") {
        return item.html;
    }

    if (item.tipo === "subtitulo") {
        return `<h3 class="subtitulo">${escaparHTML(item.texto)}</h3>`;
    }

    if (item.tipo === "paragrafo") {

        let texto = escaparHTML(item.texto);

        if (item.destaque) {
            const destaque = escaparHTML(item.destaque);

            texto = texto.replace(
                destaque,
                `<strong class="destaque">${destaque}</strong>`
            );
        }

        const numero = item.numero
            ? `<sup class="numero">${item.numero}</sup>`
            : "";

        return `
            <div class="bloco">
                <p>${numero}${texto}</p>
            </div>
        `;
    }

    if (item.tipo === "citacao") {
        return `
            <div class="bloco">
                <blockquote class="citacao">
                    <p>${escaparHTML(item.texto)}</p>
                    <span class="referencia">
                        ${escaparHTML(item.referencia)}
                    </span>
                </blockquote>
            </div>
        `;
    }

    if (item.tipo === "destaque") {
        const numero = item.numero
            ? `<sup class="numero">${item.numero}</sup>`
            : "";

        return `
            <div class="bloco fechamento">
                ${numero}<strong>${escaparHTML(item.texto)}</strong>
            </div>
        `;
    }

    return "";
}


/* =====================================================
   ELEMENTOS E ESTADO DA PAGINAÇÃO
===================================================== */

const livro = document.getElementById("livro");
const paginaEsquerda = document.getElementById("paginaEsquerda");
const paginaDireita = document.getElementById("paginaDireita");

const medidorColuna = document.getElementById("medidorColuna");

const indicador = document.getElementById("indicador");
const botaoAnterior = document.getElementById("anterior");
const botaoProxima = document.getElementById("proxima");

let paginas = [];
let indiceAtual = 0;
let modoMobile = false;


/* =====================================================
   MEDIÇÃO DO ESPAÇO DISPONÍVEL
===================================================== */

function obterModoMobile() {
    return window.matchMedia("(max-width: 650px)").matches;
}

function prepararMedidor() {

    const estiloPagina = getComputedStyle(paginaEsquerda);

    const larguraPagina = paginaEsquerda.clientWidth;

    const larguraInterna =
        larguraPagina -
        parseFloat(estiloPagina.paddingLeft) -
        parseFloat(estiloPagina.paddingRight);

    const larguraColuna = modoMobile
        ? larguraInterna
        : (larguraInterna - 22) / 2;

    const alturaInterna =
        paginaEsquerda.clientHeight - 28 - 15 - 42 - 10;

    const colunaReferencia =
        paginaEsquerda.querySelector(".coluna");

    const estiloColuna = getComputedStyle(colunaReferencia);

    medidorColuna.style.width = larguraColuna + "px";
    medidorColuna.style.height = alturaInterna + "px";
    medidorColuna.style.fontSize = estiloColuna.fontSize;
    medidorColuna.style.lineHeight = estiloColuna.lineHeight;

    return {
        largura: larguraColuna,
        altura: alturaInterna
    };
}


/* =====================================================
   AGRUPAMENTO DOS TÍTULOS COM O TEXTO SEGUINTE
===================================================== */

function formarGrupos() {

    const grupos = [];
    let i = 0;

    while (i < conteudo.length) {

        const item = conteudo[i];

        if (
            item.tipo === "subtitulo" ||
            item.tipo === "titulo"
        ) {

            let grupo = criarHTML(item);

            i++;

            /*
             * Mantém o título junto do primeiro bloco
             * de conteúdo que vem logo depois dele.
             */

            if (i < conteudo.length) {
                grupo += criarHTML(conteudo[i]);
                i++;
            }

            grupos.push(grupo);

        } else {

            grupos.push(criarHTML(item));
            i++;
        }
    }

    return grupos;
}


/* =====================================================
   DISTRIBUIÇÃO AUTOMÁTICA DAS COLUNAS
===================================================== */

function formarPaginas() {

    modoMobile = obterModoMobile();

    const medidas = prepararMedidor();
    const grupos = formarGrupos();

    const colunasGeradas = [];

    let colunaAtual = [];
    let alturaAtual = 0;

    function fecharColuna() {

        if (colunaAtual.length > 0) {
            colunasGeradas.push(colunaAtual);
        }

        colunaAtual = [];
        alturaAtual = 0;
    }

    function medirBloco(html) {

        medidorColuna.innerHTML = html;

        return medidorColuna.scrollHeight;
    }

    grupos.forEach(html => {

        const altura = medirBloco(html);
        const espacamento = 8;

        if (
            colunaAtual.length > 0 &&
            alturaAtual + altura + espacamento > medidas.altura
        ) {
            fecharColuna();
        }

        colunaAtual.push(html);
        alturaAtual += altura + espacamento;

    });

    fecharColuna();

    /*
     * Desktop: duas colunas por página.
     * Celular: uma coluna por página.
     */

    const quantidadeColunasPorPagina = modoMobile ? 1 : 2;

    paginas = [];

    for (
        let i = 0;
        i < colunasGeradas.length;
        i += quantidadeColunasPorPagina
    ) {

        paginas.push(
            colunasGeradas.slice(
                i,
                i + quantidadeColunasPorPagina
            )
        );
    }

    if (paginas.length === 0) {
        paginas = [[[]]];
    }

    const totalAberturas = modoMobile
        ? paginas.length
        : Math.ceil(paginas.length / 2);

    indiceAtual = Math.min(
        indiceAtual,
        Math.max(0, totalAberturas - 1)
    );

    renderizar();
}


/* =====================================================
   PREENCHIMENTO DAS PÁGINAS
===================================================== */

function preencherPagina(elemento, dados, numeroPagina) {

    const colunas = elemento.querySelectorAll(".coluna");

    colunas.forEach((coluna, indice) => {

        coluna.innerHTML = "";
        coluna.classList.remove("mobile-coluna");

        if (dados && dados[indice]) {
            coluna.innerHTML = dados[indice].join("");
        }
    });

    elemento.querySelector(".numero-pagina").textContent =
        numeroPagina;
}


/* =====================================================
   EXIBIÇÃO NO CELULAR
===================================================== */

function renderizarMobile() {

    paginaEsquerda.classList.add("mobile-visivel");
    paginaDireita.classList.remove("mobile-visivel");

    const dados = paginas[indiceAtual] || [];

    preencherPagina(
        paginaEsquerda,
        dados,
        indiceAtual + 1
    );

    const coluna = paginaEsquerda.querySelector(".coluna");

    coluna.classList.add("mobile-coluna");

    paginaDireita.style.display = "none";

    indicador.textContent =
        `Página ${indiceAtual + 1} de ${paginas.length}`;
}


/* =====================================================
   EXIBIÇÃO NO COMPUTADOR
===================================================== */

function renderizarDesktop() {

    paginaEsquerda.classList.add("mobile-visivel");
    paginaDireita.classList.add("mobile-visivel");

    paginaDireita.style.display = "";

    const dadosEsquerda = paginas[indiceAtual * 2] || [];
    const dadosDireita = paginas[indiceAtual * 2 + 1] || [];

    preencherPagina(
        paginaEsquerda,
        dadosEsquerda,
        indiceAtual * 2 + 1
    );

    preencherPagina(
        paginaDireita,
        dadosDireita,
        indiceAtual * 2 + 2
    );

    const totalAberturas = Math.ceil(paginas.length / 2);

    indicador.textContent =
        `Abertura ${indiceAtual + 1} de ${totalAberturas}`;
}


/* =====================================================
   ATUALIZAÇÃO DA TELA
===================================================== */

function renderizar() {

    if (modoMobile) {
        renderizarMobile();
    } else {
        renderizarDesktop();
    }

    const total = modoMobile
        ? paginas.length
        : Math.ceil(paginas.length / 2);

    botaoAnterior.disabled = indiceAtual <= 0;
    botaoProxima.disabled = indiceAtual >= total - 1;

    livro.classList.remove("animando");

    requestAnimationFrame(() => {
        livro.classList.add("animando");
    });
}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function anterior() {

    if (indiceAtual > 0) {
        indiceAtual--;
        renderizar();
    }
}

function proxima() {

    const total = modoMobile
        ? paginas.length
        : Math.ceil(paginas.length / 2);

    if (indiceAtual < total - 1) {
        indiceAtual++;
        renderizar();
    }
}

botaoAnterior.addEventListener("click", anterior);
botaoProxima.addEventListener("click", proxima);

document.addEventListener("keydown", evento => {

    if (
        evento.key === "ArrowRight" ||
        evento.key === "PageDown"
    ) {
        proxima();
    }

    if (
        evento.key === "ArrowLeft" ||
        evento.key === "PageUp"
    ) {
        anterior();
    }
});


/* =====================================================
   INICIALIZAÇÃO E REDIMENSIONAMENTO
===================================================== */

let temporizadorRedimensionamento;

function inicializar() {

    indiceAtual = 0;

    requestAnimationFrame(() => {
        formarPaginas();
    });
}

window.addEventListener("load", inicializar);

window.addEventListener("resize", () => {

    clearTimeout(temporizadorRedimensionamento);

    temporizadorRedimensionamento = setTimeout(() => {

        const novoModoMobile = obterModoMobile();

        if (novoModoMobile !== modoMobile) {
            indiceAtual = 0;
        }

        formarPaginas();

    }, 200);
});

</script>
